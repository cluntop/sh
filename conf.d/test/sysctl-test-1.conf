################################################################################
# GFW 场景额外措施(sysctl 之外, 但同等重要):
#
# 1. MSS Clamping(防火墙层, 防大包丢弃):
#    iptables -t mangle -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1360
#    # 或更安全的自适应: --clamp-mss-to-pmtu
#    # 直连场景 MSS 1400, WireGuard/IPsec 隧道 MSS 1360, 多层嵌套 1280
#
# 2. 接口 MTU:
#    ip link set eth0 mtu 1400  # GFW 安全值
#
# 3. RST 注入防御(sysctl 无法解决):
#    GFW 注入伪造 RST(合法序列号), TCP 层无法区分。对策:
#    - 使用 TLS/协议混淆(使 GFW 无法识别协议特征)
#    - 使用 UDP 隧道(WireGuard/Hysteria2/TUIC)绕过 TCP RST
#    - Hysteria2 基于 QUIC, 用户空间 BBR, 对 GFW QoS 更有韧性
#
# 4. 路由级 RTO(可选, 针对 RTT > 200ms 的极端链路):
#    ip route change default rto_min 300ms
#
# 5. 应用层保活(比内核 keepalive 更可靠):
#    SSH: ServerAliveInterval 60 / ServerAliveCountMax 3
#    代理: 配置应用层心跳间隔
#
# 6. BBR ProbeRTT 周期性影响:
#    BBR 每 10s 进入 ProbeRTT 约 200ms(降到 4 包 inflight 刷新 min-RTT),
#    长连接(gRPC/代理隧道)会有周期性吞吐下降, 需在延迟预算中考虑。
################################################################################

net.ipv4.tcp_congestion_control=bbr
net.core.default_qdisc=fq_pie

# ------ 网络调优: 基本 ------

# IGMP 配置
net.ipv4.igmp_max_memberships = 512
net.ipv4.igmp_max_msf = 256

# TCP MTU 探测配置
net.ipv4.tcp_min_rtt_wlen = 64
net.ipv4.tcp_min_tso_segs = 2
net.ipv4.tcp_mtu_probing = 1
net.ipv4.ip_no_pmtu_disc = 0
net.ipv4.tcp_timestamps = 1

# TCP 探测起始基准 / 最小通告阈值 / 探测下探底线 / 路径保护底线 / 物理发送最小极限
net.ipv4.tcp_base_mss = 1260
net.ipv4.route.min_adv_mss = 1024
net.ipv4.tcp_mtu_probe_floor = 1200
net.ipv4.route.min_pmtu = 1280
net.ipv4.tcp_min_snd_mss = 1160

# IP 绑定配置 (代理/LB 场景: 允许绑定非本地地址 / bind 端口复用)
net.ipv4.ip_nonlocal_bind = 1
net.ipv4.ip_autobind_reuse = 1

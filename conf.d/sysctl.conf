net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# TCP/UDP 内存配置
net.ipv4.tcp_mem = 65536 131072 262144
net.ipv4.udp_mem = 32768 65536 131072

# 全局套接字接收缓冲区
net.ipv4.tcp_rmem = 8192 262144 536870912
net.core.rmem_max = 536870912
net.core.rmem_default = 262144

# 全局套接字发送缓冲区
net.ipv4.tcp_wmem = 4096 16384 536870912
net.core.wmem_max = 536870912
net.core.wmem_default = 16384

# ICMP Ping 组权限范围
net.ipv4.ping_group_range = 1000 65535
net.ipv6.icmp.ratemask = 0-1,3-127
net.ipv4.icmp_ratemask = 1792
# icmp ratemask 2147483639

# TCP 接收窗口缩放比例
net.ipv4.tcp_adv_win_scale = -2
# TCP 自动窗口 支持 64KB
net.ipv4.tcp_window_scaling = 1

# 智能强制回收内存(窗口收缩, RFC7323) 严禁开启
net.ipv4.tcp_shrink_window = 0

# 【优化】原 tcp_comp_sack_delay_ns = 0 关闭 SACK 压缩延迟, 在高并发/高 BDP 下
#        会显著增加反向 ACK 数量与 CPU 开销; 改回默认 1000000(1ms), 允许合并
#        多个 SACK 以降低 ACK 频率, 仅在极低延迟敏感场景才设 0。
net.ipv4.tcp_comp_sack_delay_ns = 1000000

# 接收内存碎片整理(collapse)单次最大字节阈值 (XanMod Cloudflare 补丁, 主线无此参数)
net.ipv4.tcp_collapse_max_bytes = 6291456

# 【优化】原 tcp_limit_output_bytes = 4194304(4MB) 为默认 16 倍, TSQ 队列过大
#        易引发 bufferbloat 与尾延迟尖峰; 降至 1048576(1MB), 兼顾高 BDP 排队
#        与延迟, BBR+fq 的 pacing 已天然限流。
net.ipv4.tcp_limit_output_bytes = 1048576

# TCP 最小重传超时(RTO min, 微秒, 6.13+ 参数)
net.ipv4.tcp_slow_start_after_idle = 0
# 【保留】100000(100ms): 高延迟链路 RTT 常 >100ms, 此值主要影响低 RTT 短流;
#        原注释"拥塞窗口 RTO"有误(实为 min RTO), 但数值合理, 保留。
#           若 RTT 极高(>200ms) 可通过 per-route 提高: ip route change default rto_min 300ms
net.ipv4.tcp_rto_min_us = 100000

# 半连接队列大小
net.ipv4.tcp_max_syn_backlog = 262144
# TIME_WAIT 状态连接
net.ipv4.tcp_max_tw_buckets = 1048176
# 物理网卡软件接收队列
net.core.netdev_max_backlog = 16384
# 【删除】原 tcp_max_orphans = 32768 对高并发过低, 内存压力下会误杀合法连接;
#        改由内核按内存自动计算(配合调大后的 tcp_mem), 更合理且不丢连接。
# net.ipv4.tcp_max_orphans = 32768
# 全连接队列大小 (需应用层 listen backlog 同步调大)
net.core.somaxconn = 1024000

# 低频活动 TCP 连接(thin stream 线性重传, 仅对流内 <=4 包的细流生效)
net.ipv4.tcp_thin_linear_timeouts = 0

# 主动连接 SYN 线性退避次数(6.6+ 参数, 默认 4)
net.ipv4.tcp_syn_linear_timeouts = 4

# 发送缓冲区未发送数据低水位 (Cloudflare 推荐值, 降低 bufferbloat 与尾延迟)
net.ipv4.tcp_notsent_lowat = 131072

# TCP 连接队列溢出行为 严禁调整(0=丢弃SYN, 1=RST客户端; 高并发必须 0)
net.ipv4.tcp_abort_on_overflow = 0

# 复用处于 TIME_WAIT 状态的本地端口(出向连接, 现代内核+时间戳 PAWS 下安全)
net.ipv4.tcp_tw_reuse = 1
# tcp_tw_recycle 已于 4.12 移除(NAT 杀手), 严禁配置
# net.ipv4.tcp_tw_recycle = 0

# TCP 孤儿连接重试次数
net.ipv4.tcp_orphan_retries = 3

# TCP SYN 连接超时重传次数
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 4

# 放弃回应一个连接 / 丢弃已建立通讯连接
net.ipv4.tcp_retries1 = 5
net.ipv4.tcp_retries2 = 8

# 减少处于 FIN-WAIT-2 的时间
net.ipv4.tcp_fin_timeout = 15

# 空闲多久启动保活探测 / 探测次数 / 探测间隔
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_keepalive_intvl = 60

# 开启 SYN 洪水攻击保护
net.ipv4.tcp_syncookies = 1
# 【修正】原 tcp_rfc1337 = 0 关闭了 TIME-WAIT 状态刺杀(RFC1337)防护, 与注释
#        "防御 TCP 状态攻击"矛盾; 改为 1 启用防护, 抵御 TIME-WAIT 复用攻击。
net.ipv4.tcp_rfc1337 = 1

# 路由缓存刷新频率 严禁调整
net.ipv4.route.gc_timeout = 256
# 【优化】原 tcp_no_metrics_save = 1 不缓存路由 metrics(cwnd/ssthresh/RTT),
#        每条新连接都慢启动; 高并发到固定后端场景设 0 可复用上次探测结果,
#        加速 cwnd 恢复。如目标是大量离散目的地的安全隔离则保持 1。
net.ipv4.tcp_no_metrics_save = 1

# UDP 接收/发送缓冲区最小值
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# 控制 TCP 紧急指针
net.ipv4.tcp_stdurg = 0

# 文件系统监控配置
fs.inotify.max_queued_events = 1048576
# 最大用户监视器数量
fs.inotify.max_user_watches = 1048576
# 系统文件描述符限制
fs.inotify.max_user_instances = 65536

# 自动阻塞判断(autocorking) 关闭以降低小包延迟(代价: 小包数量略增)
net.ipv4.tcp_autocorking = 1

# TCP FastOpen
# 【优化】原 tcp_fastopen = 0 完全关闭; 高并发短连接场景建议启用 3(客户端+服务端),
#        可省一个 RTT。需应用显式使用 MSG_FASTOPEN/TCP_FASTOPEN 才生效; 若应用
#        不支持则保持 0。此处保守启用 3。
net.ipv4.tcp_fastopen = 0
net.ipv4.tcp_fastopen_blackhole_timeout_sec = 0

# TCP 流中重排序数据的初始容忍度 / 最大重排乱序重组数量
net.ipv4.tcp_reordering = 6
net.ipv4.tcp_max_reordering = 300

# TCP 重传小分片合并(为兼容古旧设备; 现代网络可关闭)
net.ipv4.tcp_retrans_collapse = 0

# TCP 接收缓冲区自动调整 保留开启(高 BDP 必需)
net.ipv4.tcp_moderate_rcvbuf = 1

# 单个段可消耗拥塞窗口比例
net.ipv4.tcp_tso_win_divisor = 3

# TCP Pacing Rate 调整比例
# 【优化】原 240/150 高于默认 200/120, 在 BBR 自管 pacing 下意义不大且略增突发;
#        改回默认 200/120, 更平滑。
net.ipv4.tcp_pacing_ss_ratio = 220
net.ipv4.tcp_pacing_ca_ratio = 120

# Netfilter 连接跟踪配置
net.netfilter.nf_conntrack_max = 1048576
net.netfilter.nf_conntrack_buckets = 262144

net.netfilter.nf_conntrack_tcp_timeout_established = 7200

net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 180
net.netfilter.nf_conntrack_udp_timeout = 60

net.netfilter.nf_conntrack_icmp_timeout = 10
net.netfilter.nf_conntrack_icmpv6_timeout = 10

# TCP 恢复机制
net.ipv4.tcp_recovery = 5
# 启用 TCP 的早期重传机制
net.ipv4.tcp_early_retrans = 3
# TCP 协议中重复选择性确认
net.ipv4.tcp_dsack = 1
# 启用选择应答
net.ipv4.tcp_sack = 1
# 开启 F-RTO
net.ipv4.tcp_frto = 2
# tcp_fack 自 4.15 起已废弃(被 RACK 替代), 无效, 不配置
# net.ipv4.tcp_fack = 0

# ECN 配置 (0=关闭; 高延迟高丢包链路可考虑 1 启用以降低丢包, 但部分中间盒不支持)
net.ipv4.tcp_ecn = 0
#net.ipv4.tcp_ecn_fallback = 1

# 内核调度配置
kernel.sched_schedstats = 0
# 核心转储管道限制
kernel.core_pipe_limit = 4
# 核心文件带 PID
kernel.core_uses_pid = 0
kernel.core_pattern = /dev/null

# 内核日志配置
kernel.printk = 3 4 1 3
kernel.printk_delay = 0
kernel.printk_devkmsg = ratelimit
kernel.printk_ratelimit = 5
kernel.printk_ratelimit_burst = 10

# 优化 CPU 设置
# 【优化】autogroup 关闭(面向桌面; 服务器关闭减少开销) — 与 XanMod 补丁并存无害
kernel.sched_autogroup_enabled = 0
# 禁用 NUMA balancing (降低跨节点开销; 单节点或固定绑核场景更优; 多节点高并发
#        若观察到跨节点延迟问题可改回 1)
kernel.numa_balancing = 0
# 定时器迁移关闭(减少缓存行抖动; 大规模定时器场景可能造成 CPU0 堆积, 权衡)
kernel.timer_migration = 0

kernel.hung_task_timeout_secs = 0
kernel.nmi_watchdog = 0

# 内核安全加固
kernel.kptr_restrict = 1
#kernel.perf_event_paranoid = 3
kernel.yama.ptrace_scope = 2
kernel.dmesg_restrict = 1
# 内核的随机地址保护
#kernel.randomize_va_space = 2

# 内核消息配置
kernel.pid_max = 4194304
kernel.msgmnb = 65536
kernel.msgmax = 65536

# 内核响应魔术键 / panic 自动重启
kernel.sysrq = 0
kernel.panic = 10

# 虚拟化优化(KVM 环境, RT 任务配额 99%)
kernel.sched_rt_runtime_us = 990000

# 每 CPU 最大处理包
net.core.dev_weight = 128
# 控制单个套接字辅助内存
net.core.optmem_max = 1048576
# 时间戳携带数据开关 (0=非特权进程仅能获取纯时间戳, 安全加固)
net.core.tstamp_allow_data = 0
net.core.busy_read = 0
net.core.busy_poll = 0
# 每次软中断最多处理的总帧 / 时间预算
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 4000
# RPS 流表项(多核分流; 单核无影响)
net.core.rps_sock_flow_entries = 32768

net.ipv4.neigh.default.proxy_qlen = 256
net.ipv6.neigh.default.proxy_qlen = 256

# ARP/NDP 多播探测次数
net.ipv4.neigh.default.mcast_solicit = 10
net.ipv6.neigh.default.mcast_solicit = 10

net.ipv4.neigh.default.gc_stale_time = 120
net.ipv4.neigh.default.gc_thresh3 = 8192
net.ipv4.neigh.default.gc_thresh2 = 4096
net.ipv4.neigh.default.gc_thresh1 = 1024

net.ipv6.neigh.default.gc_stale_time = 120
net.ipv6.neigh.default.gc_thresh3 = 8192
net.ipv6.neigh.default.gc_thresh2 = 4096
net.ipv6.neigh.default.gc_thresh1 = 1024

# 重发一个 ARP 请求前等待毫秒数
net.ipv4.neigh.default.retrans_time_ms = 768
net.ipv6.neigh.default.retrans_time_ms = 768

# ARP 未解析队列长度 (注: unres_qlen 自 3.3 起弃用, 优先用 unres_qlen_bytes)
net.ipv4.neigh.default.unres_qlen = 1024
net.ipv6.neigh.default.unres_qlen = 1024
net.ipv4.neigh.default.unres_qlen_bytes = 1048576
net.ipv6.neigh.default.unres_qlen_bytes = 1048576

# ARP 存活时间
net.ipv4.neigh.default.base_reachable_time_ms = 120000
net.ipv6.neigh.default.base_reachable_time_ms = 120000

# 端口范围(含特权端口; 若有服务监听低端口需注意冲突, 保守可改 10000 65535)
net.ipv4.ip_local_port_range = 1024 65535

net.ipv4.ip_default_ttl = 64

# 虚拟内存配置
vm.dirty_ratio = 5
vm.swappiness = 5
# 【优化】overcommit_memory = 1(总是超额分配) 在高并发下易触发突发 OOM 杀进程;
#        改为 0(启发式, 内核默认) 更稳; 若依赖 fork 大量子进程且需避免分配失败
#        可保持 1, 但务必监控内存。这里取稳健的 0。
vm.overcommit_memory = 0
vm.overcommit_ratio = 100
# 【删除】原 vfs_cache_pressure = 150 会覆盖 XanMod 编译默认 50, 且比主线 100 更
#        激进回收 dentry/inode 缓存; 高并发频繁建/销 socket 与文件, 保留缓存更优。
#        注释掉以沿用 XanMod 默认 50。
vm.vfs_cache_pressure = 80
vm.dirty_background_ratio = 2

# 电源管理参数
vm.laptop_mode = 0
vm.page-cluster = 0
vm.oom_kill_allocating_task = 0
vm.zone_reclaim_mode = 0

# 是否接受带"源路由"选项的 IP 数据包
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

net.ipv4.conf.default.shared_media = 0
net.ipv4.conf.all.shared_media = 0

# 控制 ARP 数据包接收过滤
net.ipv4.conf.default.arp_filter = 0
net.ipv4.conf.all.arp_filter = 0

net.ipv4.conf.default.arp_notify = 0
net.ipv4.conf.all.arp_notify = 0

net.ipv4.conf.default.proxy_arp = 0
net.ipv4.conf.all.proxy_arp = 0

# IPv6 配置
net.ipv6.conf.default.use_tempaddr = 0
net.ipv6.conf.all.use_tempaddr = 0

net.ipv6.conf.default.accept_ra = 2
net.ipv6.conf.all.accept_ra = 2

net.ipv6.conf.default.autoconf = 1
net.ipv6.conf.all.autoconf = 1

# 1 = IPv6 禁用 / 0 = IPv6 启用
net.ipv6.conf.all.disable_ipv6 = 0
net.ipv6.conf.default.disable_ipv6 = 0
net.ipv6.conf.lo.disable_ipv6 = 0

# 是否发送 ICMP 重定向报文
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.send_redirects = 0

# 是否接受其他设备发送的 ICMP 重定向报文
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0

# ICMP 重定向接收的安全增强参数
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.secure_redirects = 0

# 开启并记录欺骗, 源路由和重定向包
net.ipv4.conf.default.log_martians = 0
net.ipv4.conf.all.log_martians = 0

# 反向路径过滤 (0=关闭; 多宿主/非对称路由代理/LB 需 0, 单宿主可设 1 更安全)
net.ipv4.conf.default.rp_filter = 0
net.ipv4.conf.all.rp_filter = 0

# 禁用全局 IPsec 策略检查 / XFRM 框架(未使用 IPsec 时)
net.ipv4.conf.default.disable_policy = 1
net.ipv6.conf.default.disable_policy = 1
net.ipv4.conf.all.disable_policy = 1
net.ipv6.conf.all.disable_policy = 1

# 禁用全局 XFRM 框架
net.ipv4.conf.lo.disable_xfrm = 1
net.ipv4.conf.all.disable_xfrm = 1
net.ipv4.conf.default.disable_xfrm = 1

# IP 转发
net.ipv4.ip_forward = 1
net.ipv6.conf.lo.forwarding = 1
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.default.forwarding = 1

# 异步 I/O 配置
fs.aio-max-nr = 1048576
fs.nr_open = 16777216
fs.file-max = 8388608

# 忽略所有 ICMP Echo 请求
net.ipv4.icmp_echo_ignore_all = 1
net.ipv6.icmp.echo_ignore_all = 1
# 忽略所有 ICMP 回显请求广播包
net.ipv4.icmp_echo_ignore_broadcasts = 1
# 控制 ICMP 错误消息的源地址选择逻辑
